ServerName localhost
ServerTokens Prod
ServerSignature Off

<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted

    # WordPress front-controller rules, baked into the image so pretty
    # permalinks and /wp-json/ work regardless of what WordPress writes to
    # .htaccess (the production filesystem is ephemeral). If .htaccess also
    # carries the WordPress block, its identical rules simply take precedence.
    RewriteEngine On
    RewriteBase /
    RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]
    RewriteRule ^index\.php$ - [L]
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule . /index.php [L]
</Directory>

# Never serve dotfiles: the repo root is the web root, so .env, .mcp.json,
# .gitignore and friends are bind-mounted right next to index.php locally.
# Apache checks the .well-known path component before WordPress rewrites it.
# Allow that public discovery namespace; hidden files beneath it stay denied.
<FilesMatch "^\.(?!well-known$)">
    Require all denied
</FilesMatch>

# FilesMatch alone does not cover ordinary files inside hidden directories,
# such as the bind-mounted .git/config. Keep those directories private too.
<DirectoryMatch "^/var/www/html/(?:.*/)?\.(?!well-known(?:/|$))">
    Require all denied
</DirectoryMatch>

# Attack surface nothing on this site uses (REST and MCP replace XML-RPC).
<FilesMatch "^(xmlrpc\.php|readme\.html|license\.txt|wp-config-sample\.php)$">
    Require all denied
</FilesMatch>

# Uploads are data, never code.
<Directory /var/www/html/wp-content/uploads>
    <FilesMatch "\.(php|phtml|phar)$">
        Require all denied
    </FilesMatch>
</Directory>

# Baseline headers. HSTS is added only in production by the entrypoint.
Header always set X-Content-Type-Options "nosniff"
Header always set Referrer-Policy "strict-origin-when-cross-origin"

# Real client IPs behind the TLS-terminating proxy (local Caddy / your host's proxy).
RemoteIPHeader X-Forwarded-For
