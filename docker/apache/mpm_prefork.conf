# Replaces Debian's default (MaxRequestWorkers 150), which would let a small
# container fork far more mod_php children than its memory can hold.
# Each child can grow to WP_MEMORY_LIMIT (256M); 10 workers suits roughly 1-2 GB.
# Override per environment with the APACHE_MAX_REQUEST_WORKERS variable.
<IfModule mpm_prefork_module>
    StartServers             2
    MinSpareServers          2
    MaxSpareServers          5
    MaxRequestWorkers        ${APACHE_MAX_REQUEST_WORKERS}
    MaxConnectionsPerChild   1000
</IfModule>
